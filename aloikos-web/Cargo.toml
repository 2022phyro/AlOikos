[package]
name = "aloikos-web"
version = "0.1.0"
edition = "2021"

[dependencies]
jsonwebtoken = "9.3.1"
redis = { version = "0.32", features = ["aio", "tokio-comp"] }
futures = "*"
chrono = "*"
serde = "*"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"
dotenv = "0.15"