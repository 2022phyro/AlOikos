[package]
name = "aloikos-web"
version = "0.1.0"
edition = "2021"

[dependencies]
jsonwebtoken = "9.3.1"
redis = { version = "0.32", features = ["aio", "tokio-comp"] }
futures = "0.3"
chrono = "0.4"
serde = { version = "1.0", features = ["serde_derive", "rc", "derive"] }
tokio = { version = "1.0", features = ["full", "mio", "test-util", "tracing"] }
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"
dotenv = "0.15"
lazy_static = "1.4"
rand = { version = "0.8", features = ["std"] }
base32 = "0.4"
constant_time_eq = "0.3"
qrcode = "0.7"          # QR image generation
image = "0.24"          # For rendering PNGs (if needed)
dialoguer = "0.11"      # Optional - for reading user input in CLI demos
rs-snowflake = "0.6"
argon2 = "0.5.3"
totp-rs = { version = "5.7.0", features = ["serde_support", "otpauth", "qr", "gen_secret"] }
urlencoding = "2.1.3"
hex = "0.4.3"
sea-orm = { version = "1.1.13", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls", "macros", "mock" ] }
validator = { version = "0.20.0", features = ["validator_derive", "derive"] }
once_cell = "1.21.3"
async-once-cell = "0.5.4"
chacha20poly1305 = "0.10.1"
sha2 = "0.10.8"
base64 = "0.22.0"
tower = "0.5.2"
hyper = "1.6.0"
utoipa = { version = "5.4.0", features = ["axum_extras", "debug", "chrono", "time", "url", "uuid", "decimal", "rc_schema", "yaml", "openapi_extensions", "config", "auto_into_responses"] }
axum = { version = "0.8.4", features = ["macros", "multipart", "ws", "http2"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing = "0.1.41"
tower-http = { version = "0.6.6", features = ["trace"] }
